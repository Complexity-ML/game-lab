name: Publish stable source release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing semantic-version tag to publish
        required: true
        default: v0.1.0

permissions:
  contents: write

concurrency:
  group: game-lab-source-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test and publish immutable source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Test renderer and Electron boundaries
        run: npm test

      - name: Resolve immutable release tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="$REQUESTED_TAG"
          fi
          VERSION="$(node -p "require('./package.json').version")"
          test "$TAG" = "v$VERSION"
          git rev-parse "refs/tags/$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Publish stable source release
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "GAME LAB $TAG" \
              --generate-notes
          fi
